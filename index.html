<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E5D45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ascent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>Ascent</title>
</head>
<body>

<header>
  <div class="goalRow" id="goalRow"></div>
  <div>
    <h1 id="goalTitle">Ascent</h1>
    <p class="sub" id="goalSub">A trail toward something worth reaching.</p>
  </div>
</header>

<div id="trailWrap">
  <svg id="trailSvg" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<button id="fab">+ Add step</button>

<div class="sheetBg" id="stepSheetBg">
  <div class="sheet">
    <h2 id="sheetTitle">New step</h2>
    <div class="field">
      <label for="stepLabelInput">What is it</label>
      <input type="text" id="stepLabelInput" placeholder="e.g. Finish first draft">
    </div>
    <div class="field">
      <label for="stepNotesInput">Notes (optional)</label>
      <textarea id="stepNotesInput" rows="2" placeholder="Any detail worth remembering"></textarea>
    </div>
    <div class="field" id="predFieldWrap">
      <label>Comes after</label>
      <div class="hint">Pick one step to continue the trail, or more than one to converge two paths into this step.</div>
      <div class="predList" id="predList"></div>
    </div>
    <div class="sheetActions">
      <button class="btn ghost" id="cancelStepBtn">Cancel</button>
      <button class="btn primary" id="saveStepBtn">Add to trail</button>
    </div>
  </div>
</div>

<div class="sheetBg" id="detailSheetBg">
  <div class="sheet">
    <h2 id="detailTitle">Step</h2>
    <p class="sub" id="detailNotes" style="margin-bottom:18px;"></p>
    <div class="sheetActions">
      <button class="btn ghost" id="closeDetailBtn">Close</button>
      <button class="btn primary" id="toggleDoneBtn">Mark done</button>
    </div>
    <div class="sheetActions" id="deleteRow">
      <button class="btn danger" id="deleteStepBtn">Remove this step</button>
    </div>
  </div>
</div>

<div class="sheetBg" id="goalSheetBg">
  <div class="sheet">
    <h2>New goal</h2>
    <div class="field">
      <label for="newGoalInput">What's the mountain?</label>
      <input type="text" id="newGoalInput" placeholder="e.g. Launch the film">
    </div>
    <div class="sheetActions">
      <button class="btn ghost" id="cancelGoalBtn">Cancel</button>
      <button class="btn primary" id="saveGoalBtn">Start trail</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
